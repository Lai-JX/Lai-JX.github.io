<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1180" viewBox="0 0 1400 1180" role="img" aria-labelledby="title desc">
  <title id="title">SGLang 与 vLLM 的编译和 CUDA Graph 整体流程</title>
  <desc id="desc">对比 SGLang 按 Prefill 和 Decode 分阶段选择 CUDA Graph 后端，以及 vLLM 通过自定义编译后端和运行时 Dispatcher 选择 FULL、PIECEWISE 或 eager 的流程。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <marker id="compileArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/>
    </marker>
    <marker id="graphArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#0369a1"/>
    </marker>
    <style>
      .title{font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#0f172a}
      .subtitle{font:16px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#475569}
      .section{font:700 24px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#0f172a}
      .heading{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#0f172a}
      .text{font:16px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#334155}
      .small{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#475569}
      .code{font:14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#334155}
      .panel{fill:#ffffff;stroke:#94a3b8;stroke-width:1.5}
      .box{stroke:#64748b;stroke-width:1.5}
      .plain{fill:#f8fafc}.compile{fill:#f3e8ff;stroke:#7c3aed}.graph{fill:#e0f2fe;stroke:#0369a1}.eager{fill:#fef3c7;stroke:#d97706}.dispatch{fill:#dcfce7;stroke:#16a34a}.result{fill:#ecfccb;stroke:#65a30d}
      .line{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .compileLine{stroke:#7c3aed;stroke-width:2.3;fill:none;marker-end:url(#compileArrow)}
      .graphLine{stroke:#0369a1;stroke-width:2.3;fill:none;marker-end:url(#graphArrow)}
      .dash{stroke-dasharray:7 5}
    </style>
  </defs>

  <rect width="1400" height="1180" fill="#f8fafc"/>
  <text x="700" y="45" text-anchor="middle" class="title">推理框架中的编译与 CUDA Graph</text>
  <text x="700" y="73" text-anchor="middle" class="subtitle">紫色表示编译，蓝色表示 CUDA Graph capture/replay，黄色表示 eager 区域</text>

  <!-- SGLang -->
  <rect x="35" y="100" width="1330" height="450" rx="18" class="panel"/>
  <text x="65" y="138" class="section">SGLang：Prefill / Decode 分阶段选择后端</text>

  <rect x="65" y="245" width="145" height="70" rx="10" class="box plain"/>
  <text x="137" y="274" text-anchor="middle" class="heading">请求批次</text>
  <text x="137" y="298" text-anchor="middle" class="small">静态输入缓冲区</text>
  <path d="M210 280 H250" class="line"/>

  <path d="M300 230 L355 280 L300 330 L245 280 Z" class="box dispatch"/>
  <text x="300" y="274" text-anchor="middle" class="heading">执行阶段</text>
  <text x="300" y="297" text-anchor="middle" class="small">Prefill / Decode</text>

  <!-- SGLang prefill lane -->
  <path d="M300 230 V190 H395" class="line"/>
  <text x="315" y="181" class="small">Prefill</text>
  <rect x="400" y="155" width="190" height="70" rx="10" class="box plain"/>
  <text x="495" y="184" text-anchor="middle" class="heading">原始 forward</text>
  <text x="495" y="207" text-anchor="middle" class="small">不依赖 torch.compile</text>
  <path d="M590 190 H635" class="graphLine"/>
  <rect x="640" y="145" width="360" height="90" rx="10" class="box graph"/>
  <text x="820" y="176" text-anchor="middle" class="heading">BREAKABLE CUDA Graph</text>
  <text x="820" y="202" text-anchor="middle" class="code">Graph 0 → eager break → Graph 1</text>
  <text x="820" y="222" text-anchor="middle" class="small">在 Attention / 通信等标记处暂停捕获</text>
  <path d="M1000 190 H1050" class="graphLine"/>
  <rect x="1055" y="155" width="245" height="70" rx="10" class="box result"/>
  <text x="1177" y="184" text-anchor="middle" class="heading">分段 replay</text>
  <text x="1177" y="207" text-anchor="middle" class="small">中间操作保持 eager</text>

  <!-- SGLang decode lane -->
  <path d="M300 330 V390 H395" class="line"/>
  <text x="315" y="381" class="small">Decode</text>
  <rect x="400" y="350" width="190" height="80" rx="10" class="box plain"/>
  <text x="495" y="380" text-anchor="middle" class="heading">Decode forward</text>
  <text x="495" y="405" text-anchor="middle" class="small">按 batch/shape bucket</text>
  <path d="M590 390 H635" class="compileLine"/>
  <rect x="640" y="342" width="280" height="96" rx="10" class="box compile"/>
  <text x="780" y="373" text-anchor="middle" class="heading">可选 torch.compile</text>
  <text x="780" y="398" text-anchor="middle" class="code">max-autotune-no-cudagraphs</text>
  <text x="780" y="421" text-anchor="middle" class="small">仅编译阈值内的 batch size</text>
  <path d="M920 390 H965" class="graphLine"/>
  <rect x="970" y="350" width="190" height="80" rx="10" class="box graph"/>
  <text x="1065" y="380" text-anchor="middle" class="heading">FULL CUDA Graph</text>
  <text x="1065" y="405" text-anchor="middle" class="small">框架在外层统一捕获</text>
  <path d="M1160 390 H1200" class="graphLine"/>
  <rect x="1205" y="350" width="95" height="80" rx="10" class="box result"/>
  <text x="1252" y="383" text-anchor="middle" class="heading">Replay</text>
  <text x="1252" y="407" text-anchor="middle" class="small">整图</text>

  <rect x="400" y="467" width="900" height="48" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="850" y="497" text-anchor="middle" class="text">可选 TC_PIECEWISE：Dynamo/FX 切图后逐段编译和捕获；不同于 BREAKABLE</text>

  <!-- vLLM -->
  <rect x="35" y="575" width="1330" height="510" rx="18" class="panel"/>
  <text x="65" y="613" class="section">vLLM：自定义编译管线 + CudagraphDispatcher</text>

  <rect x="65" y="650" width="175" height="72" rx="10" class="box plain"/>
  <text x="152" y="680" text-anchor="middle" class="heading">PyTorch forward</text>
  <text x="152" y="704" text-anchor="middle" class="small">模型入口</text>
  <path d="M240 686 H285" class="compileLine"/>
  <rect x="290" y="650" width="175" height="72" rx="10" class="box compile"/>
  <text x="377" y="680" text-anchor="middle" class="heading">TorchDynamo</text>
  <text x="377" y="704" text-anchor="middle" class="small">捕获 FX Graph</text>
  <path d="M465 686 H510" class="compileLine"/>
  <rect x="515" y="640" width="245" height="92" rx="10" class="box compile"/>
  <text x="637" y="672" text-anchor="middle" class="heading">VLLM_COMPILE</text>
  <text x="637" y="697" text-anchor="middle" class="small">切图、缓存、shape 特化</text>
  <text x="637" y="718" text-anchor="middle" class="small">Inductor 优化与自定义 pass</text>
  <path d="M760 686 H805" class="compileLine"/>
  <rect x="810" y="650" width="230" height="72" rx="10" class="box plain"/>
  <text x="925" y="680" text-anchor="middle" class="heading">Compiled callables</text>
  <text x="925" y="704" text-anchor="middle" class="small">完整或分段执行单元</text>

  <rect x="65" y="790" width="210" height="72" rx="10" class="box plain"/>
  <text x="170" y="820" text-anchor="middle" class="heading">运行时 Batch</text>
  <text x="170" y="844" text-anchor="middle" class="small">类型、尺寸、后端能力</text>
  <path d="M275 826 H365" class="line"/>
  <path d="M925 722 V755 H470 V780" class="line dash"/>
  <path d="M470 780 L570 826 L470 872 L370 826 Z" class="box dispatch"/>
  <text x="470" y="819" text-anchor="middle" class="heading">Cudagraph</text>
  <text x="470" y="842" text-anchor="middle" class="heading">Dispatcher</text>

  <path d="M570 806 H660 V765 H735" class="graphLine"/>
  <text x="615" y="786" class="small">Uniform Decode</text>
  <rect x="740" y="730" width="255" height="72" rx="10" class="box graph"/>
  <text x="867" y="760" text-anchor="middle" class="heading">FULL CUDA Graph</text>
  <text x="867" y="784" text-anchor="middle" class="small">捕获整个 Decode forward</text>

  <path d="M570 826 H735" class="graphLine"/>
  <text x="598" y="817" class="small">Prefill / Mixed</text>
  <rect x="740" y="820" width="255" height="82" rx="10" class="box graph"/>
  <text x="867" y="850" text-anchor="middle" class="heading">PIECEWISE CUDA Graph</text>
  <text x="867" y="875" text-anchor="middle" class="small">可捕获子图分别包装</text>
  <text x="867" y="894" text-anchor="middle" class="small">Attention 等留在 graph 外</text>

  <path d="M550 855 H660 V952 H735" class="line"/>
  <text x="600" y="944" class="small">不兼容 / 未命中尺寸</text>
  <rect x="740" y="920" width="255" height="72" rx="10" class="box eager"/>
  <text x="867" y="950" text-anchor="middle" class="heading">Eager / 直接执行</text>
  <text x="867" y="974" text-anchor="middle" class="small">自动降级保证兼容性</text>

  <path d="M995 766 H1070" class="graphLine"/>
  <path d="M995 861 H1070" class="graphLine"/>
  <path d="M995 956 H1070" class="line"/>
  <rect x="1075" y="795" width="225" height="122" rx="10" class="box result"/>
  <text x="1187" y="832" text-anchor="middle" class="heading">执行结果</text>
  <text x="1187" y="860" text-anchor="middle" class="text">FULL / PIECEWISE replay</text>
  <text x="1187" y="886" text-anchor="middle" class="text">或直接运行 callable</text>

  <rect x="65" y="1015" width="1235" height="46" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="682" y="1044" text-anchor="middle" class="text">默认 FULL_AND_PIECEWISE：Decode 选 FULL，Prefill/Mixed 选 PIECEWISE；能力不足时自动降级</text>

  <rect x="35" y="1110" width="1330" height="45" rx="10" fill="#e2e8f0"/>
  <text x="700" y="1139" text-anchor="middle" class="heading">共同原则：编译器优化 Kernel，推理框架管理 CUDA Graph 的 capture、缓存、选择与 replay</text>
</svg>
