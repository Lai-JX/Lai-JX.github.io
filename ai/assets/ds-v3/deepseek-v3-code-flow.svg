<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="950" viewBox="0 0 1280 950" role="img" aria-labelledby="title desc">
  <title id="title">DeepSeek-V3 源码执行流</title>
  <desc id="desc">顶部展示从 Token IDs 到 logits 的单向主流程，下方展开一个 Pre-Norm Transformer Block 的两条残差路径，并标出训练期 MTP。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#e0e7ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 30px system-ui, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px system-ui, sans-serif; fill: #475569; }
      .label { font: 700 17px system-ui, sans-serif; fill: #0f172a; }
      .body { font: 400 14px system-ui, sans-serif; fill: #334155; }
      .small { font: 400 12px system-ui, sans-serif; fill: #475569; }
      .badge { font: 700 13px system-ui, sans-serif; fill: #3730a3; }
      .flow { stroke: #475569; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .residual { stroke: #2563eb; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .detail { stroke: #7c3aed; stroke-width: 2; stroke-dasharray: 8 7; fill: none; }
    </style>
  </defs>

  <rect width="1280" height="950" rx="24" fill="url(#bg)"/>
  <text x="52" y="55" class="title">DeepSeek-V3：源码视角的单向执行流</text>
  <text x="52" y="84" class="subtitle">实线箭头表示前向数据流；蓝线表示 residual bypass；虚线只表示结构展开关系</text>

  <!-- 主模型：严格从左到右 -->
  <g filter="url(#shadow)">
    <rect x="45" y="130" width="155" height="76" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="122" y="161" text-anchor="middle" class="label">Token IDs</text>
    <text x="122" y="185" text-anchor="middle" class="small">[B, S]</text>

    <rect x="250" y="130" width="190" height="76" rx="14" fill="#ecfeff" stroke="#67e8f9"/>
    <text x="345" y="161" text-anchor="middle" class="label">词嵌入</text>
    <text x="345" y="185" text-anchor="middle" class="small">129,280 × 7,168</text>

    <rect x="500" y="118" width="285" height="100" rx="16" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
    <text x="642" y="153" text-anchor="middle" class="label">Transformer Block × 61</text>
    <text x="642" y="178" text-anchor="middle" class="body">每层 MLA；前 3 层 Dense FFN</text>
    <text x="642" y="199" text-anchor="middle" class="body">后 58 层 DeepSeekMoE</text>

    <rect x="845" y="130" width="170" height="76" rx="14" fill="#f0fdf4" stroke="#86efac"/>
    <text x="930" y="161" text-anchor="middle" class="label">Final RMSNorm</text>
    <text x="930" y="185" text-anchor="middle" class="small">取最后位置</text>

    <rect x="1075" y="130" width="160" height="76" rx="14" fill="#fff7ed" stroke="#fdba74"/>
    <text x="1155" y="161" text-anchor="middle" class="label">LM Head</text>
    <text x="1155" y="185" text-anchor="middle" class="small">logits [B, V]</text>
  </g>

  <path d="M200 168 H250" class="flow"/>
  <path d="M440 168 H500" class="flow"/>
  <path d="M785 168 H845" class="flow"/>
  <path d="M1015 168 H1075" class="flow"/>

  <!-- 主模型方框到下方展开图：不是数据流，不使用箭头 -->
  <path d="M642 218 V265" class="detail"/>
  <text x="658" y="250" class="small">展开一个 Block</text>

  <!-- 单个 Transformer Block 展开 -->
  <g filter="url(#shadow)">
    <rect x="55" y="275" width="1170" height="500" rx="22" fill="#ffffff" stroke="#a5b4fc" stroke-width="2"/>
    <rect x="55" y="275" width="1170" height="56" rx="22" fill="url(#header)"/>
    <path d="M55 311 H1225" stroke="#a5b4fc"/>
    <text x="82" y="311" class="label">单个 Transformer Block：Pre-Norm + 两次 Residual Add</text>
    <text x="1188" y="311" text-anchor="end" class="badge">输入输出均为 [B, S, 7,168]</text>

    <rect x="300" y="350" width="270" height="48" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="435" y="380" text-anchor="middle" class="label">输入 x</text>

    <rect x="300" y="430" width="270" height="72" rx="14" fill="#eff6ff" stroke="#60a5fa"/>
    <text x="435" y="458" text-anchor="middle" class="label">RMSNorm → MLA</text>
    <text x="435" y="482" text-anchor="middle" class="body">128 heads；KV latent 512 + RoPE 64</text>

    <circle cx="435" cy="545" r="16" fill="#ffffff" stroke="#475569" stroke-width="2"/>
    <path d="M426 545 H444 M435 536 V554" stroke="#475569" stroke-width="2"/>
    <text x="475" y="532" class="small">Add 1，得到 x′</text>

    <rect x="300" y="590" width="270" height="78" rx="14" fill="#f5f3ff" stroke="#a78bfa"/>
    <text x="435" y="619" text-anchor="middle" class="label">RMSNorm → FFN</text>
    <text x="435" y="643" text-anchor="middle" class="body">层 0–2：Dense SwiGLU</text>
    <text x="435" y="662" text-anchor="middle" class="small">层 3–60：DeepSeekMoE</text>

    <circle cx="435" cy="715" r="16" fill="#ffffff" stroke="#475569" stroke-width="2"/>
    <path d="M426 715 H444 M435 706 V724" stroke="#475569" stroke-width="2"/>
    <text x="475" y="702" class="small">Add 2，得到 Block 输出</text>

    <path d="M435 398 V430" class="flow"/>
    <path d="M435 502 V529" class="flow"/>
    <path d="M435 561 V590" class="flow"/>
    <path d="M435 668 V699" class="flow"/>
    <path d="M435 731 V753" class="flow"/>

    <!-- Residual 1：输入 x 绕过 MLA，流入 Add 1 -->
    <path d="M300 374 H230 V545 H417" class="residual"/>
    <text x="238" y="448" class="small">residual x</text>

    <!-- Residual 2：x' 绕过 FFN，流入 Add 2 -->
    <path d="M451 545 H650 V715 H453" class="residual"/>
    <text x="658" y="635" class="small">residual x′</text>

    <!-- 右侧实现摘要 -->
    <rect x="760" y="365" width="385" height="104" rx="15" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="785" y="396" class="label">MLA</text>
    <text x="785" y="422" class="body">Q：7,168 → 1,536 → 128 × 192</text>
    <text x="785" y="447" class="body">KV Cache：512-d latent + 64-d RoPE key</text>

    <rect x="760" y="495" width="385" height="112" rx="15" fill="#faf5ff" stroke="#c4b5fd"/>
    <text x="785" y="526" class="label">DeepSeekMoE</text>
    <text x="785" y="552" class="body">256 routed experts → Top-4 groups → Top-8</text>
    <text x="785" y="577" class="body">加权 routed output + 1 个 shared expert</text>

    <rect x="760" y="635" width="385" height="92" rx="15" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="785" y="666" class="label">对应源码</text>
    <text x="785" y="692" class="body">x = x + attn(attn_norm(x))</text>
    <text x="785" y="714" class="body">x = x + ffn(ffn_norm(x))</text>
  </g>

  <!-- 训练期附加模块：单独标注，避免与主推理流混淆 -->
  <g filter="url(#shadow)">
    <rect x="55" y="820" width="1170" height="88" rx="18" fill="#faf5ff" stroke="#c084fc" stroke-width="2"/>
    <text x="82" y="852" class="label">训练期 MTP（开源权重含 1 个模块；本目录推理 demo 跳过）</text>
    <text x="82" y="879" class="body">主模型 hidden + 未来真实 token embedding → 2d→d 投影 → 额外 Transformer Block → 共享 LM Head</text>
    <text x="1178" y="879" text-anchor="end" class="small">推理时可丢弃，或用于 speculative decoding</text>
  </g>
</svg>
