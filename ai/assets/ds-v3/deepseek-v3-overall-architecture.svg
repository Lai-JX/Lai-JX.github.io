<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="930" viewBox="0 0 1200 930" role="img" aria-labelledby="title desc">
  <title id="title">DeepSeek-V3 整体架构</title>
  <desc id="desc">从 Token 到词表 Logits 的 61 层 Transformer 主干，以及 MLA、Dense MLP、DeepSeekMoE 和可选 MTP 模块。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>
      .title{font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#0f172a}.h{font:700 19px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#0f172a}.t{font:15px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#334155}.small{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;fill:#475569}.box{stroke:#334155;stroke-width:1.6;rx:12}.arr{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="930" fill="#f8fafc"/>
  <text x="600" y="48" text-anchor="middle" class="title">DeepSeek-V3：稀疏 MoE Transformer 主干</text>
  <text x="600" y="76" text-anchor="middle" class="t">671B 主模型参数 · 每 token 激活约 37B · 61 个 Transformer Block · 128K 上下文</text>

  <rect x="60" y="118" width="250" height="72" class="box" fill="#dbeafe"/>
  <text x="185" y="148" text-anchor="middle" class="h">Token IDs</text><text x="185" y="173" text-anchor="middle" class="t">词表 129,280</text>
  <path d="M310 154 H365" class="arr"/>
  <rect x="370" y="118" width="260" height="72" class="box" fill="#dbeafe"/>
  <text x="500" y="148" text-anchor="middle" class="h">并行 Embedding</text><text x="500" y="173" text-anchor="middle" class="t">hidden size d = 7,168</text>
  <path d="M630 154 H685" class="arr"/>
  <rect x="690" y="118" width="445" height="72" class="box" fill="#e0e7ff"/>
  <text x="912" y="148" text-anchor="middle" class="h">61 × Pre-Norm Transformer Block</text><text x="912" y="173" text-anchor="middle" class="t">MLA 子层 + FFN 子层；每个子层都有残差连接</text>

  <rect x="70" y="244" width="1060" height="510" rx="20" fill="#ffffff" stroke="#64748b" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="100" y="281" class="h">第 ℓ 个 Transformer Block</text>
  <rect x="120" y="312" width="190" height="58" class="box" fill="#f1f5f9"/><text x="215" y="347" text-anchor="middle" class="h">RMSNorm</text>
  <path d="M310 341 H360" class="arr"/>
  <rect x="365" y="298" width="330" height="86" class="box" fill="#cffafe"/>
  <text x="530" y="328" text-anchor="middle" class="h">MLA 注意力</text><text x="530" y="352" text-anchor="middle" class="t">Q 低秩压缩 + KV 联合压缩</text><text x="530" y="373" text-anchor="middle" class="small">只对 64 维解耦部分施加 RoPE / YaRN</text>
  <path d="M695 341 H745" class="arr"/>
  <rect x="750" y="312" width="190" height="58" class="box" fill="#ede9fe"/><text x="845" y="347" text-anchor="middle" class="h">残差相加</text>
  <path d="M940 341 H985 V430 H940" class="arr"/>

  <rect x="750" y="401" width="190" height="58" class="box" fill="#f1f5f9"/><text x="845" y="436" text-anchor="middle" class="h">RMSNorm</text>
  <path d="M750 430 H700" class="arr"/>
  <rect x="365" y="397" width="330" height="72" class="box" fill="#fef3c7"/>
  <text x="530" y="426" text-anchor="middle" class="h">FFN</text><text x="530" y="452" text-anchor="middle" class="t">层 0–2：Dense SwiGLU；层 3–60：DeepSeekMoE</text>
  <path d="M365 433 H315" class="arr"/>
  <rect x="120" y="404" width="190" height="58" class="box" fill="#ede9fe"/><text x="215" y="439" text-anchor="middle" class="h">残差相加</text>

  <rect x="120" y="523" width="970" height="184" rx="15" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6"/>
  <text x="145" y="555" class="h">DeepSeekMoE（58 层）</text>
  <rect x="155" y="583" width="195" height="72" class="box" fill="#ffedd5"/><text x="252" y="612" text-anchor="middle" class="h">Router</text><text x="252" y="637" text-anchor="middle" class="t">Sigmoid + 分组 Top-k</text>
  <path d="M350 619 H400" class="arr"/>
  <rect x="405" y="573" width="270" height="92" class="box" fill="#fed7aa"/><text x="540" y="603" text-anchor="middle" class="h">8 / 256 路由专家</text><text x="540" y="628" text-anchor="middle" class="t">每个专家：SwiGLU, hidden 2,048</text><text x="540" y="650" text-anchor="middle" class="small">8 组中先选 4 组，再选 8 个专家</text>
  <text x="705" y="625" class="h">＋</text>
  <rect x="745" y="583" width="300" height="72" class="box" fill="#dcfce7"/><text x="895" y="612" text-anchor="middle" class="h">1 个共享专家（始终执行）</text><text x="895" y="637" text-anchor="middle" class="t">承载通用知识，减少路由冗余</text>

  <path d="M912 190 V225" class="arr"/>
  <path d="M600 754 V792" class="arr"/>
  <rect x="365" y="797" width="470" height="65" class="box" fill="#dbeafe"/><text x="600" y="824" text-anchor="middle" class="h">Final RMSNorm → 并行 LM Head</text><text x="600" y="848" text-anchor="middle" class="t">只取最后位置 hidden state，输出 129,280 维 logits</text>
  <path d="M835 830 H890" class="arr"/>
  <rect x="895" y="797" width="240" height="65" class="box" fill="#dcfce7"/><text x="1015" y="824" text-anchor="middle" class="h">采样 / Argmax</text><text x="1015" y="848" text-anchor="middle" class="t">得到下一个 token</text>

  <rect x="60" y="885" width="1080" height="30" rx="8" fill="#eef2ff"/>
  <text x="600" y="906" text-anchor="middle" class="small">可选 MTP：主干之后附加 1 个预测模块（开源权重），训练时增强信号；推理框架可将其作为 speculative draft</text>
</svg>
