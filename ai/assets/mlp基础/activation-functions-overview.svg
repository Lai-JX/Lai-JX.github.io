<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
  <title id="title">LLM FFN 常见激活函数汇总</title>
  <desc id="desc">以四个独立子图对比 ReLU、GELU、SiLU/Swish 与 Sigmoid，并在每张图中给出公式。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F9FD"/><stop offset="1" stop-color="#EEF4FA"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-12%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#17345F" flood-opacity="0.08"/>
    </filter>
    <clipPath id="clipA"><rect x="100" y="190" width="440" height="205"/></clipPath>
    <clipPath id="clipB"><rect x="660" y="190" width="440" height="205"/></clipPath>
    <clipPath id="clipC"><rect x="100" y="535" width="440" height="205"/></clipPath>
    <clipPath id="clipD"><rect x="660" y="535" width="440" height="205"/></clipPath>
  </defs>

  <rect width="1200" height="860" rx="28" fill="url(#bg)"/>
  <text x="600" y="48" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="31" font-weight="700" fill="#19345D">LLM FFN 常见激活函数</text>
  <text x="600" y="78" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="15" fill="#60738F">四种函数分别绘制：对比负值处理、平滑性以及 gate 的输出范围</text>

  <!-- Card backgrounds -->
  <rect x="55" y="105" width="530" height="325" rx="20" fill="#FFF" stroke="#F1B2B8" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="615" y="105" width="530" height="325" rx="20" fill="#FFF" stroke="#C0BAF0" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="55" y="450" width="530" height="325" rx="20" fill="#FFF" stroke="#8AD6CB" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="615" y="450" width="530" height="325" rx="20" fill="#FFF" stroke="#EDCB82" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Titles and formulas -->
  <g font-family="Microsoft YaHei,Arial,sans-serif">
    <circle cx="91" cy="139" r="9" fill="#E95967"/><text x="110" y="147" font-size="22" font-weight="700" fill="#C93E4C">ReLU</text>
    <rect x="350" y="120" width="195" height="38" rx="11" fill="#FFF0F2"/>
    <text x="447" y="146" text-anchor="middle" font-family="Cambria Math,serif" font-size="20" fill="#92313B">f(x) = max(0, x)</text>

    <circle cx="651" cy="139" r="9" fill="#6E63D9"/><text x="670" y="147" font-size="22" font-weight="700" fill="#554AB9">GELU</text>
    <rect x="910" y="120" width="195" height="38" rx="11" fill="#F0EEFF"/>
    <text x="1007" y="146" text-anchor="middle" font-family="Cambria Math,serif" font-size="20" fill="#493FA3">f(x) = x · Φ(x)</text>

    <circle cx="91" cy="484" r="9" fill="#0EA58F"/><text x="110" y="492" font-size="22" font-weight="700" fill="#087F70">SiLU / Swish</text>
    <rect x="350" y="465" width="195" height="38" rx="11" fill="#E8F8F5"/>
    <text x="447" y="491" text-anchor="middle" font-family="Cambria Math,serif" font-size="20" fill="#076F63">f(x) = x · σ(x)</text>

    <circle cx="651" cy="484" r="9" fill="#E59A20"/><text x="670" y="492" font-size="22" font-weight="700" fill="#B8750C">Sigmoid</text>
    <rect x="880" y="465" width="225" height="38" rx="11" fill="#FFF5DD"/>
    <text x="992" y="491" text-anchor="middle" font-family="Cambria Math,serif" font-size="19" fill="#98620C">σ(x) = 1 / (1 + e⁻ˣ)</text>
  </g>

  <!-- Reusable-looking grids, x domain [-5,5] -->
  <g stroke="#E2E9F2" stroke-width="1">
    <!-- ReLU -->
    <line x1="100" y1="205" x2="540" y2="205"/><line x1="100" y1="275" x2="540" y2="275"/><line x1="100" y1="345" x2="540" y2="345"/>
    <line x1="144" y1="190" x2="144" y2="395"/><line x1="320" y1="190" x2="320" y2="395"/><line x1="496" y1="190" x2="496" y2="395"/>
    <!-- GELU -->
    <line x1="660" y1="205" x2="1100" y2="205"/><line x1="660" y1="275" x2="1100" y2="275"/><line x1="660" y1="345" x2="1100" y2="345"/>
    <line x1="704" y1="190" x2="704" y2="395"/><line x1="880" y1="190" x2="880" y2="395"/><line x1="1056" y1="190" x2="1056" y2="395"/>
    <!-- SiLU -->
    <line x1="100" y1="550" x2="540" y2="550"/><line x1="100" y1="620" x2="540" y2="620"/><line x1="100" y1="690" x2="540" y2="690"/>
    <line x1="144" y1="535" x2="144" y2="740"/><line x1="320" y1="535" x2="320" y2="740"/><line x1="496" y1="535" x2="496" y2="740"/>
    <!-- Sigmoid -->
    <line x1="660" y1="550" x2="1100" y2="550"/><line x1="660" y1="620" x2="1100" y2="620"/><line x1="660" y1="690" x2="1100" y2="690"/>
    <line x1="704" y1="535" x2="704" y2="740"/><line x1="880" y1="535" x2="880" y2="740"/><line x1="1056" y1="535" x2="1056" y2="740"/>
  </g>

  <!-- Axes -->
  <g stroke="#899BB2" stroke-width="1.5">
    <line x1="100" y1="345" x2="545" y2="345"/><line x1="320" y1="185" x2="320" y2="400"/>
    <line x1="660" y1="345" x2="1105" y2="345"/><line x1="880" y1="185" x2="880" y2="400"/>
    <line x1="100" y1="690" x2="545" y2="690"/><line x1="320" y1="530" x2="320" y2="745"/>
    <line x1="660" y1="725" x2="1105" y2="725"/><line x1="880" y1="530" x2="880" y2="745"/>
  </g>

  <!-- Curves; first three use y in [-1,5], Sigmoid uses y in [0,1] -->
  <g fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M100 345 L320 345 L540 170" stroke="#E95967" clip-path="url(#clipA)"/>
    <path d="M660 345 C740 345 790 346 836 351 C855 353 869 350 880 345 C912 331 950 292 968 274 C1015 229 1060 196 1100 170" stroke="#6E63D9" clip-path="url(#clipB)"/>
    <path d="M100 692 C180 694 235 701 276 703 C295 703 310 697 320 690 C350 670 390 636 408 624 C455 583 500 544 540 516" stroke="#0EA58F" clip-path="url(#clipC)"/>
    <path d="M660 723 C735 721 800 704 836 668 C855 648 868 632 880 620 C892 608 905 592 924 572 C960 536 1025 520 1100 517" stroke="#E59A20" clip-path="url(#clipD)"/>
  </g>

  <!-- Axis labels -->
  <g font-family="Arial,Microsoft YaHei,sans-serif" font-size="12" fill="#6C7F99">
    <g text-anchor="middle">
      <text x="144" y="367">−4</text><text x="320" y="367">0</text><text x="496" y="367">4</text>
      <text x="704" y="367">−4</text><text x="880" y="367">0</text><text x="1056" y="367">4</text>
      <text x="144" y="712">−4</text><text x="320" y="712">0</text><text x="496" y="712">4</text>
      <text x="704" y="747">−4</text><text x="880" y="747">0</text><text x="1056" y="747">4</text>
    </g>
    <g text-anchor="end">
      <text x="91" y="349">0</text><text x="91" y="279">2</text><text x="91" y="209">4</text>
      <text x="651" y="349">0</text><text x="651" y="279">2</text><text x="651" y="209">4</text>
      <text x="91" y="694">0</text><text x="91" y="624">2</text><text x="91" y="554">4</text>
      <text x="651" y="729">0</text><text x="651" y="624">0.5</text><text x="651" y="519">1</text>
    </g>
  </g>

  <!-- Per-panel takeaways -->
  <g font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" font-weight="700">
    <rect x="125" y="394" width="390" height="25" rx="9" fill="#FFF0F2"/><text x="320" y="412" text-anchor="middle" fill="#B83C49">硬截断负值 · Vanilla FFN / ReGLU</text>
    <rect x="685" y="394" width="390" height="25" rx="9" fill="#F0EEFF"/><text x="880" y="412" text-anchor="middle" fill="#5147AE">平滑且保留少量负值 · GELU / GEGLU</text>
    <rect x="125" y="739" width="390" height="25" rx="9" fill="#E8F8F5"/><text x="320" y="757" text-anchor="middle" fill="#08796B">平滑非单调 · 现代 LLM / SwiGLU</text>
    <rect x="685" y="739" width="390" height="25" rx="9" fill="#FFF5DD"/><text x="880" y="757" text-anchor="middle" fill="#A66C0C">输出范围 (0,1) · GLU gate / Router affinity</text>
  </g>

  <text x="600" y="823" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="15" fill="#526986">在 GLU 家族中：激活函数作用于 gate 分支，再与 value 分支逐元素相乘</text>
</svg>
